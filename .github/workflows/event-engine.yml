name: Zone Signal Engine

on:
  repository_dispatch:
    types: [run_event_engine]

permissions:
  contents: write
  actions: read

concurrency:
  group: zone-engine
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BINGX_API_KEY: ${{ secrets.BINGX_API_KEY }}
      BINGX_SECRET_KEY: ${{ secrets.BINGX_SECRET_KEY }}
      BINGX_ENV: vst
      BINGX_BASE_URL: https://open-api-vst.bingx.com
      BINGX_MARGIN_USDT: "1"
      BINGX_LEVERAGE: "10"
      BINGX_MAX_LEVERAGE: "10"
      EXECUTION_ENABLED: "true"
      MAX_SCAN_SYMBOLS: "0"
      WATCHLIST_ONLY: "false"
      RESET_ZONE_VISIT_STATE_ON_START: "false"
      WATCHLIST_SYMBOLS: "BTC-USDT,ETH-USDT,SOL-USDT,BNB-USDT,TAO-USDT,LTC-USDT,BCH-USDT,AVAX-USDT,LINK-USDT,ETC-USDT,ADA-USDT,UNI-USDT,XRP-USDT,ICP-USDT,HYPE-USDT,DOGE-USDT,HBAR-USDT,ARB-USDT,POL-USDT,SUI-USDT"
      KLINE_LIMIT_1H: "1000"
      KLINE_LIMIT_5M: "144"
      MAX_5M_TRIGGER_AGE_MINUTES: "10"
      INITIAL_5M_TRIGGER_LOOKBACK_MINUTES: "15"
      MAX_SIGNAL_AGE_BARS: "0"
      MAX_SIGNAL_RISK_PCT: "10.00"
      FIXED_STOP_PCT: "10.00"
      MAX_ENTRY_SLIPPAGE_PCT: "1.00"
      MAX_ENTRY_SIGNAL_DISPLACEMENT_PCT: "1.00"
      EXECUTION_QUOTE_MAX_AGE_SEC: "2.0"
      # Live execution is fail-closed when BingX does not provide a usable quote timestamp.
      # A local observation timestamp is retained for diagnostics, but it is not sufficient for order admission.
      EXECUTION_REQUIRE_EXCHANGE_TIMESTAMP: "true"
      EXECUTION_UNKNOWN_QUOTE_AGE_POLICY: "block"
      MAX_SCAN_HISTORY_BYTES: "31457280"
      MIN_STRUCTURE_ROOM_R: "1.20"
      REQUIRE_DIRECTIONAL_CANDLE: "false"
      REQUIRE_STRUCTURE_OBSTACLE: "false"
      FAILED_SIGNAL_TTL_SEC: "86400"
      EXECUTION_MAX_SIGNAL_AGE_BARS: "0"
      DIAGNOSTICS_MODE: "historical"
      RESEARCH_ENABLED: "true"
      RESEARCH_5M_HISTORY_LIMIT: "288"
      RESEARCH_DEPTH_LEVELS: "20"
      RESEARCH_RECENT_TRADES_LIMIT: "100"
      # Trend Filter V1 is shadow-only for the current research phase. It never
      # changes Demand/Supply construction or the existing closed-5m trigger.
      TREND_FILTER_ENABLED: "true"
      TREND_FILTER_MODE: "shadow"
      TREND_FILTER_MIN_1H_BARS: "400"
      TREND_FILTER_MIN_4H_BARS: "400"
      TREND_FILTER_PERSISTENCE_LOOKBACK_1H: "6"
      TREND_FILTER_PERSISTENCE_LOOKBACK_4H: "3"
      TREND_FILTER_SLOPE_LOOKBACK_4H: "6"
      TREND_FILTER_HISTORY_BUFFER_BARS: "12"
      TREND_FILTER_REQUIRE_PERSISTENCE: "false"
      ENTRY_CONTEXT_TELEMETRY_ENABLED: "true"
      ENTRY_CONTEXT_DEPTH_LEVELS: "20"
      ENTRY_CONTEXT_TRADES_LIMIT: "100"
      ENTRY_CONTEXT_HTTP_TIMEOUT_SEC: "2.0"
      # Research must never add the four-endpoint microstructure sweep to the
      # production signal -> order critical path. It remains available as a
      # deliberate opt-in for research runs.
      RESEARCH_RICH_CONTEXT_ENABLED: "false"
      RESEARCH_DEFER_UNTIL_AFTER_EXECUTION: "true"
      RESEARCH_CONTEXT_NEAREST_APPROACH: "false"
      RESEARCH_CONTEXT_FOR_REJECTIONS: "false"
      RESEARCH_ACCOUNT_TIMEOUT_SEC: "5"
      RESEARCH_ACCOUNT_ACTIVITY_LOOKBACK_MINUTES: "15"
      SCAN_WORKERS: "12"
      SCAN_BATCH_SIZE: "48"
      SCAN_BATCH_PAUSE_SEC: "0.10"
      RECONCILIATION_HTTP_TIMEOUT_SEC: "5"
      RECONCILIATION_MAX_SECONDS: "45"
      BINGX_HTTP_TIMEOUT_SEC: "10"
      BINANCE_MARKET_BASE_URL: https://data-api.binance.vision
      BINANCE_HTTP_TIMEOUT_SEC: "10"
      BINANCE_EXCHANGE_INFO_TTL_SEC: "1800"
      BINANCE_ASSET_CLASSES: "CRYPTO,EQUITY"
      BINANCE_SYMBOL_MAP: "{}"
      MAX_MARKET_SPREAD_PCT: "1.50"
      TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
      TG_CHAT_IDS: ${{ secrets.TG_CHAT_IDS }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: main
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            pip-${{ runner.os }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Syntax check
        run: python -m compileall -q event_engine run_once.py research_forward.py restore_research_history_seed.py pine_r541_sr.py pine_sr_diagnostic.py test_all.py test_pine_sr_diagnostic.py test_research_layer.py test_restore_research_history_seed.py test_research_cursor_portability.py test_workflow_rollback.py

      - name: Run tests
        id: tests
        env:
          ZONE_ENGINE_TESTS_ISOLATED: "1"
        run: python -m pytest -q

      - name: Verify tests did not mutate runtime data
        id: verify_tests_data
        shell: bash
        run: |
          set -euo pipefail
          if ! git diff --quiet -- data; then
            echo "ERROR: pytest modified tracked runtime data/ files."
            git diff -- data
            exit 1
          fi
          ignored=$(git status --ignored --porcelain -- data | grep -E '^!!' || true)
          if [ -n "$ignored" ]; then
            echo "ERROR: pytest created ignored runtime artifacts inside production data/:"
            echo "$ignored"
            exit 1
          fi

      - name: Restore cumulative retention archive from previous successful runs
        id: restore_retention_archive
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/retention_archive
          echo "recovery_safe=false" >> "$GITHUB_OUTPUT"
          echo "status=not_checked" >> "$GITHUB_OUTPUT"
          tmp_dir="$(mktemp -d)"
          trap 'rm -rf "$tmp_dir"' EXIT
          found_archive=false

          # Query archive artifacts directly first. Do not intersect them with only
          # the latest 100 workflow runs: a frequently triggered workflow can have
          # more than 100 runs since the last archive upload, even while its 90-day
          # artifact is still valid. Validate only artifact-owned run IDs below.
          artifact_json=""
          for api_attempt in 1 2 3; do
            if artifact_json="$(gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=zone-engine-retention-archive&per_page=100" 2>/dev/null)"; then
              break
            fi
            artifact_json=""
            sleep "$api_attempt"
          done
          if [ -z "$artifact_json" ] || ! jq -e 'type == "array" and length > 0 and all(.[]; .artifacts | type == "array")' >/dev/null <<< "$artifact_json"; then
            echo "::warning::GitHub artifacts API unavailable after retries; retention restore/compaction is paused for safety. Position management will continue."
            echo "status=artifacts_api_error" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          total_named_artifacts="$(jq '[.[].artifacts[] | select(.name == "zone-engine-retention-archive")] | length' <<< "$artifact_json")"
          available_named_artifacts="$(jq '[.[].artifacts[] | select(.name == "zone-engine-retention-archive") | select(.expired == false)] | length' <<< "$artifact_json")"
          if [ "$available_named_artifacts" -eq 0 ]; then
            if [ -f data/retention_archive_state.json ] || [ "$total_named_artifacts" -gt 0 ]; then
              echo "::warning::The retention archive chain was previously initialized but no unexpired archive is available; compaction/upload is paused to avoid replacing historical archives with an incomplete chain."
              echo "status=archive_missing" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::warning::No previous retention archive exists; treating this as the initial archive generation."
            echo "status=no_prior_archive" >> "$GITHUB_OUTPUT"
            echo "recovery_safe=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          workflow_id=""
          for api_attempt in 1 2 3; do
            if workflow_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/event-engine.yml" --jq '.id' 2>/dev/null)" && [[ "$workflow_id" =~ ^[0-9]+$ ]]; then
              break
            fi
            workflow_id=""
            sleep "$api_attempt"
          done
          if [ -z "$workflow_id" ]; then
            echo "::warning::Could not identify event-engine.yml through the GitHub API; retention restore/compaction is paused for safety. Position management will continue."
            echo "status=workflow_api_error" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          artifact_candidates="$(jq -r '
            [ .[].artifacts[]
              | select(.name == "zone-engine-retention-archive")
              | select(.expired == false)
              | select(.workflow_run.id != null)
              | select(.workflow_run.head_branch == "main")
              | {created_at: .created_at, run_id: .workflow_run.id}
            ]
            | group_by(.run_id)
            | map(max_by(.created_at))
            | sort_by(.created_at)
            | reverse
            | .[]
            | [.created_at, (.run_id | tostring)]
            | @tsv
          ' <<< "$artifact_json")"

          if [ -z "$artifact_candidates" ]; then
            echo "::warning::Named archive artifacts exist, but no unexpired main-branch artifact has a run ID; retention compaction is paused."
            echo "status=no_suitable_archive" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          artifact_runs=""
          eligible_count=0
          run_api_errors=0
          while IFS=$'\t' read -r created_at run_id; do
            [ -n "$run_id" ] || continue
            run_json=""
            if ! run_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" 2>/dev/null)"; then
              run_api_errors=$((run_api_errors + 1))
              continue
            fi
            if jq -e --argjson expected_workflow_id "$workflow_id" '
              .workflow_id == $expected_workflow_id
              and .head_branch == "main"
              and .event == "repository_dispatch"
              and .status == "completed"
              and .conclusion == "success"
            ' >/dev/null <<< "$run_json"; then
              printf -v candidate_line '%s\t%s\n' "$created_at" "$run_id"
              artifact_runs+="$candidate_line"
              eligible_count=$((eligible_count + 1))
              [ "$eligible_count" -ge 3 ] && break
            fi
          done <<< "$artifact_candidates"

          if [ -z "$artifact_runs" ]; then
            if [ "$run_api_errors" -gt 0 ]; then
              echo "::warning::GitHub run-details API failed for archive candidates; retention restore/compaction is paused for safety."
              echo "status=run_details_api_error" >> "$GITHUB_OUTPUT"
            else
              echo "::warning::Named artifacts exist, but none belongs to a successful event-engine.yml repository_dispatch run on main; retention compaction is paused."
              echo "status=no_suitable_archive" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi

          while IFS=$'\t' read -r created_at run_id; do
            [ -n "$run_id" ] || continue
            if gh run download "$run_id" --name zone-engine-retention-archive --repo "$GITHUB_REPOSITORY" --dir "$tmp_dir"; then
              if find "$tmp_dir" -type f -print -quit | grep -q .; then
                found_archive=true
                echo "Retention archive found in successful event-engine.yml run $run_id created at $created_at."
                break
              fi
            fi
            rm -rf "$tmp_dir"/* "$tmp_dir"/.[!.]* "$tmp_dir"/..?* 2>/dev/null || true
          done <<< "$artifact_runs"

          if [ "$found_archive" = true ]; then
            cp -a "$tmp_dir"/. data/retention_archive/
            echo "Restored cumulative retention archive from a previous successful workflow run."
            find data/retention_archive -type f | wc -l
            echo "status=restored" >> "$GITHUB_OUTPUT"
            echo "recovery_safe=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::The three newest eligible retention archives could not be downloaded; compaction/upload is paused to avoid losing older pruned rows. Position management will continue."
            echo "status=download_failed" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify restored retention archive fingerprint
        id: retention_archive_restore_verification
        if: ${{ always() && steps.restore_retention_archive.outputs.recovery_safe == 'true' }}
        continue-on-error: true
        run: >-
          python -m event_engine.retention_archive --verify-restored
          --archive-dir data/retention_archive
          --state-file data/retention_archive_state.json
          --github-output "$GITHUB_OUTPUT"

      - name: Restore immutable research outcome seed
        id: restore_research_history_seed
        # Only attempt recovery after the test suite and its data-isolation guard
        # succeeded. A skipped step must not be reported as a failed restoration.
        if: ${{ success() && steps.tests.outcome == 'success' && steps.verify_tests_data.outcome == 'success' }}
        continue-on-error: true
        run: python restore_research_history_seed.py

      - name: Report research seed restore status
        if: ${{ always() && steps.tests.outcome == 'success' && steps.verify_tests_data.outcome == 'success' && steps.restore_research_history_seed.outcome == 'failure' }}
        run: echo "::warning::Research outcome seed restoration actually failed. Existing trading-state management continues, but historical research data may remain incomplete."

      - name: Run engine
        env:
          FUNDAMENTAL_WHITELIST_ENABLED: "false"
          # Keep the explicitly tested production entry semantics: a 5m touch
          # creates the signal and the trigger-bar close is the market-entry
          # reference. Do not silently change this to midpoint execution.
          # The structure-room gate comes from the top-level env (1.20R).
          ZONE_TRIGGER_MODE: "zone"
        run: python run_once.py

      - name: Update research outcomes
        id: research_outcomes
        # This writes persistent research state. Never run it after tests or the
        # runtime-data isolation guard failed; the runner is ephemeral but state
        # can otherwise be committed by an always()-conditioned cleanup step.
        if: ${{ always() && steps.tests.outcome == 'success' && steps.verify_tests_data.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 3
        env:
          PYTHONUNBUFFERED: "1"
        run: python research_forward.py --write

      - name: Report research outcome status
        if: ${{ steps.research_outcomes.outcome != 'success' }}
        run: echo "::warning::research_forward.py --write did not complete successfully; trading state remains commit-safe and outcomes will be retried on the next run."

      - name: Pre-commit data size guard
        id: size_guard
        if: ${{ always() && steps.restore_retention_archive.outputs.recovery_safe == 'true' && steps.retention_archive_restore_verification.outcome == 'success' }}
        env:
          DATA_RETENTION_SIZE_GUARD_BYTES: "90000000"
          DATA_RETENTION_SIZE_TARGET_BYTES: "80000000"
          DATA_RETENTION_ARCHIVE_DIR: data/retention_archive
        run: |
          set -euo pipefail
          python -m event_engine.data_retention --size-guard --archive-dir data/retention_archive

      - name: Decide whether retention archive upload is needed
        id: retention_archive_upload_decision
        if: ${{ always() && steps.size_guard.outcome == 'success' && steps.restore_retention_archive.outputs.recovery_safe == 'true' && steps.retention_archive_restore_verification.outcome == 'success' }}
        run: >-
          python -m event_engine.retention_archive --decide-upload
          --archive-dir data/retention_archive
          --state-file data/retention_archive_state.json
          --refresh-days 45
          --github-output "$GITHUB_OUTPUT"

      - name: Upload cumulative retention archive for next clean runner
        id: upload_retention_archive
        if: ${{ always() && steps.retention_archive_upload_decision.outcome == 'success' && steps.retention_archive_upload_decision.outputs.archive_upload_required == 'true' && steps.restore_retention_archive.outputs.recovery_safe == 'true' && steps.retention_archive_restore_verification.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: zone-engine-retention-archive
          path: data/retention_archive/
          if-no-files-found: error
          retention-days: 90
          compression-level: 1

      - name: Mark retention archive upload durable
        id: mark_retention_archive
        if: ${{ always() && steps.upload_retention_archive.outcome == 'success' && steps.restore_retention_archive.outputs.recovery_safe == 'true' && steps.retention_archive_restore_verification.outcome == 'success' }}
        run: >-
          python -m event_engine.retention_archive --mark-upload
          --archive-dir data/retention_archive
          --state-file data/retention_archive_state.json
          --expected-sha256 "${{ steps.retention_archive_upload_decision.outputs.archive_sha256 }}"
          --run-id "$GITHUB_RUN_ID"
          --github-output "$GITHUB_OUTPUT"

      - name: Restore pre-compaction journals if retention archive upload failed
        id: restore_pre_compaction_snapshots
        if: ${{ always() && steps.size_guard.outcome == 'success' && (steps.retention_archive_upload_decision.outcome != 'success' || (steps.retention_archive_upload_decision.outputs.archive_upload_required == 'true' && steps.upload_retention_archive.outcome != 'success')) }}
        shell: bash
        run: |
          set -euo pipefail
          python -m event_engine.data_retention \
            --restore-pre-compaction-snapshots \
            --manifest data/data_retention_manifest.json \
            --archive-dir data/retention_archive \
            --github-output "$GITHUB_OUTPUT"

      - name: Verify retention archive is durable before commit
        id: retention_archive_commit_gate
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          tests_outcome="${{ steps.tests.outcome }}"
          verify_tests_data_outcome="${{ steps.verify_tests_data.outcome }}"
          if [ "$tests_outcome" != "success" ]; then
            echo "::error::Tests did not pass (outcome=$tests_outcome); refusing to commit persistent state."
            exit 1
          fi
          if [ "$verify_tests_data_outcome" != "success" ]; then
            echo "::error::Runtime-data isolation verification did not pass (outcome=$verify_tests_data_outcome); refusing to commit persistent state."
            exit 1
          fi
          rollback_outcome="${{ steps.restore_pre_compaction_snapshots.outcome }}"
          rollback_restored="${{ steps.restore_pre_compaction_snapshots.outputs.restored_any }}"
          size_guard_outcome="${{ steps.size_guard.outcome }}"
          compaction_triggered=false

          # The size-guard manifest is rewritten each time that step succeeds.
          # If it is absent or malformed, we cannot prove whether compaction
          # occurred, so fail closed rather than commit unverifiable state.
          if [ "$size_guard_outcome" = "success" ]; then
            if [ ! -f data/data_retention_manifest.json ]; then
              echo "::error::Size guard succeeded without a retention manifest; refusing to commit unverifiable state."
              exit 1
            fi
            if ! jq -e '.mode == "size_guard" and (.files | type == "object") and (.files | length > 0)' data/data_retention_manifest.json >/dev/null; then
              echo "::error::Size-guard retention manifest is malformed; refusing to commit unverifiable state."
              exit 1
            fi
            if jq -e '[.files[] | select(.triggered == true)] | length > 0' data/data_retention_manifest.json >/dev/null; then
              compaction_triggered=true
            fi
          fi

          # A rollback attempt must never fail open, regardless of whether the
          # archive directory currently contains files.
          if [ "$rollback_outcome" = "failure" ]; then
            echo "::error::Pre-compaction snapshot restoration failed; refusing to commit state."
            exit 1
          fi
          if [ "$compaction_triggered" = "true" ]; then
            if [ "$rollback_outcome" = "success" ] && [ "$rollback_restored" = "true" ]; then
              echo "::warning::Retention archive upload did not complete; full pre-compaction journals were restored and will be committed only if every staged file is below GitHub's 100,000,000-byte hard limit."
              exit 0
            fi
            if [ "$rollback_outcome" = "success" ] && [ "$rollback_restored" != "true" ]; then
              echo "::error::The size guard compacted journals, but rollback reported no restored files; refusing to commit."
              exit 1
            fi
            if ! find data/retention_archive -type f -print -quit | grep -q .; then
              echo "::error::The size guard compacted journals, but no retention archive is available and rollback did not restore the journals; refusing to commit."
              exit 1
            fi
          fi
          if find data/retention_archive -type f -print -quit | grep -q .; then
            if [ "${{ steps.retention_archive_restore_verification.outcome }}" != "success" ]; then
              if [ "${{ steps.size_guard.outcome }}" = "skipped" ]; then
                echo "::warning::Restored retention archive failed its fingerprint check; no compaction was run, so ordinary state may still be committed subject to the staged-size guard."
                exit 0
              fi
              echo "::error::Retention archive fingerprint check failed after the size guard; refusing to commit compacted journals."
              exit 1
            fi
            if [ "${{ steps.restore_retention_archive.outputs.recovery_safe }}" != "true" ]; then
              echo "::error::Retention archive files are present but the prior archive chain was not safely restored; refusing to commit compaction."
              exit 1
            fi
            if [ "${{ steps.retention_archive_upload_decision.outcome }}" != "success" ]; then
              echo "::error::Retention archive upload decision did not complete; refusing to commit compacted journals."
              exit 1
            fi
            if [ "${{ steps.retention_archive_upload_decision.outputs.archive_upload_required }}" = "true" ]; then
              if [ "${{ steps.upload_retention_archive.outcome }}" != "success" ]; then
                echo "::error::Retention archive changed or needs refresh, but artifact upload did not succeed; refusing to commit compacted journals."
                exit 1
              fi
              if [ "${{ steps.mark_retention_archive.outcome }}" != "success" ]; then
                echo "::error::Retention archive uploaded, but its persistent fingerprint marker was not written; refusing to commit compacted journals."
                exit 1
              fi
            else
              python -m event_engine.retention_archive --verify-upload \
                --archive-dir data/retention_archive \
                --state-file data/retention_archive_state.json \
                --expected-sha256 "${{ steps.retention_archive_upload_decision.outputs.archive_sha256 }}" \
                --refresh-days 45
            fi
          fi
          echo "Retention archive commit gate passed."

      - name: Upload diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zone-engine-diagnostic-${{ github.run_id }}
          path: data/zone_engine_diagnostic.log
          if-no-files-found: warn
          retention-days: 14

      - name: Commit state
        # Do not persist anything after failed tests/verification, even when the
        # always()-conditioned commit gate or archive steps were skipped/passed.
        if: ${{ !cancelled() && steps.tests.outcome == 'success' && steps.verify_tests_data.outcome == 'success' && (steps.size_guard.outcome == 'success' || steps.restore_retention_archive.outputs.recovery_safe != 'true' || steps.retention_archive_restore_verification.outcome != 'success') && steps.retention_archive_commit_gate.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "actions-user"
          git config user.email "actions@github.com"
          git status --short
          # Stage all persistent engine state, including newly-created files.
          # Keep the unbounded scan journal local-only.
          git add data/
          git reset -- data/scan_history.jsonl data/scan_history.jsonl.* data/zone_engine_diagnostic.log 2>/dev/null || true
          if [ "${{ steps.restore_pre_compaction_snapshots.outputs.restored_any }}" = "true" ]; then
            # Exact rollback restores the original full journals. Permit them only
            # when each staged file remains strictly below GitHub's hard 100 MB limit.
            python -m event_engine.data_retention --check-staged --limit-bytes 100000000
          else
            python -m event_engine.data_retention --check-staged
          fi
          if git diff --cached --quiet; then
            echo "No state changes"
            exit 0
          fi
          git commit -m "zone engine snapshot $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if git rebase origin/main; then
              if git push origin HEAD:main; then
                echo "State pushed successfully"
                exit 0
              fi
            else
              git rebase --abort 2>/dev/null || true
            fi
            sleep $((attempt * 3))
          done
          exit 1
