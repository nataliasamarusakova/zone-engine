name: Zone Signal Engine

on:
  repository_dispatch:
    types: [run_event_engine]

permissions:
  contents: write

concurrency:
  group: zone-engine
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BINGX_API_KEY: ${{ secrets.BINGX_API_KEY }}
      BINGX_SECRET_KEY: ${{ secrets.BINGX_SECRET_KEY }}
      BINGX_ENV: vst
      BINGX_BASE_URL: https://open-api-vst.bingx.com
      BINGX_MARGIN_USDT: "1"
      BINGX_LEVERAGE: "10"
      BINGX_MAX_LEVERAGE: "10"
      EXECUTION_ENABLED: "true"
      MAX_TRADES_PER_CYCLE: "5"
      MAX_SCAN_SYMBOLS: "0"
      WATCHLIST_ONLY: "true"
      WATCHLIST_SYMBOLS: "BTC-USDT,ETH-USDT,SOL-USDT,BNB-USDT,XRP-USDT,DOGE-USDT,TRX-USDT,HYPE-USDT,XMR-USDT,ZEC-USDT,LINK-USDT,ADA-USDT,XLM-USDT,BCH-USDT,UNI-USDT,LTC-USDT,AVAX-USDT,SUI-USDT,HBAR-USDT,TAO-USDT,ICP-USDT,ARB-USDT,POL-USDT,ETC-USDT"
      KLINE_LIMIT_1H: "1000"
      MAX_SIGNAL_AGE_BARS: "0"
      MAX_SIGNAL_RISK_PCT: "1.50"
      MAX_ENTRY_SLIPPAGE_PCT: "1.00"
      MAX_SCAN_HISTORY_BYTES: "31457280"
      MAX_ZONE_AGE_BARS: "30"
      MIN_STRUCTURE_ROOM_R: "1.20"
      REQUIRE_DIRECTIONAL_CANDLE: "true"
      REQUIRE_STRUCTURE_OBSTACLE: "true"
      TP_MIN_R: "0.50"
      TP_MAX_R: "1.50"
      FAILED_SIGNAL_TTL_SEC: "86400"
      EXECUTION_MAX_SIGNAL_AGE_BARS: "0"
      DIAGNOSTICS_MODE: "historical"
      REQUIRE_ZONE_TOUCH: "true"
      ZONE_SL_ATR_BUFFER: "0.10"
      TP1_R: "0.5"
      TP2_R: "1.0"
      SCAN_WORKERS: "12"
      SCAN_BATCH_SIZE: "48"
      SCAN_BATCH_PAUSE_SEC: "0.10"
      RECONCILIATION_HTTP_TIMEOUT_SEC: "5"
      RECONCILIATION_MAX_SECONDS: "45"
      BINGX_HTTP_TIMEOUT_SEC: "10"
      BINANCE_MARKET_BASE_URL: https://data-api.binance.vision
      BINANCE_HTTP_TIMEOUT_SEC: "10"
      BINANCE_EXCHANGE_INFO_TTL_SEC: "1800"
      BINANCE_ASSET_CLASSES: "CRYPTO,EQUITY"
      BINANCE_SYMBOL_MAP: "{}"
      MAX_MARKET_SPREAD_PCT: "1.50"
      TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
      TG_CHAT_IDS: ${{ secrets.TG_CHAT_IDS }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: main
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            pip-${{ runner.os }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Syntax check
        run: python -m compileall -q event_engine run_once.py test_all.py

      - name: Run tests
        run: python -m pytest -q

      - name: Run engine
        run: python run_once.py

      - name: Commit state
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "actions-user"
          git config user.email "actions@github.com"
          git status --short
          # Stage all persistent engine state, including newly-created files.
          # Keep the unbounded scan journal local-only.
          git add data/
          git reset -- data/scan_history.jsonl data/scan_history.jsonl.* 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No state changes"
            exit 0
          fi
          git commit -m "zone engine snapshot $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if git rebase origin/main; then
              if git push origin HEAD:main; then
                echo "State pushed successfully"
                exit 0
              fi
            else
              git rebase --abort 2>/dev/null || true
            fi
            sleep $((attempt * 3))
          done
          exit 1
